<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:;">
    <title>更新中心 — Transub</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="vendor/app.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background: #f3f4f6;
            color: #1f2937;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .upd-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem 0.875rem;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(180deg, #fff 0%, #fafafa 100%);
            flex-shrink: 0;
        }
        .upd-header img {
            width: 2.25rem;
            height: 2.25rem;
        }
        .upd-header h1 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .upd-header p {
            margin: 0.2rem 0 0;
            font-size: 0.75rem;
            color: #9ca3af;
        }
        .upd-tabs {
            display: flex;
            gap: 0.25rem;
            padding: 0 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            flex-shrink: 0;
        }
        .upd-tab-btn {
            position: relative;
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 0.8125rem;
            font-weight: 500;
            padding: 0.65rem 0.875rem;
            cursor: pointer;
            line-height: 1.25;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .upd-tab-btn:hover {
            color: #374151;
        }
        .upd-tab-btn.is-active {
            color: #6d28d9;
            font-weight: 600;
            border-bottom-color: #7c3aed;
        }
        .upd-tab-btn .upd-tab-badge {
            display: inline-block;
            margin-left: 0.35rem;
            min-width: 0.375rem;
            height: 0.375rem;
            border-radius: 9999px;
            background: #7c3aed;
            vertical-align: middle;
        }
        .upd-tab-btn .upd-tab-badge.hidden {
            display: none;
        }
        .upd-body {
            flex: 1;
            min-height: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .upd-tab-panel {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            overflow-y: auto;
        }
        .upd-tab-panel.is-active {
            display: flex;
        }
        .upd-version-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .upd-version-pill {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.45rem 0.625rem;
            background: #f9fafb;
        }
        .upd-version-pill.is-highlight {
            border-color: #ddd6fe;
            background: #faf5ff;
        }
        .upd-version-label {
            display: block;
            font-size: 0.625rem;
            color: #9ca3af;
            margin-bottom: 0.15rem;
        }
        .upd-version-value {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #374151;
            font-variant-numeric: tabular-nums;
        }
        .upd-version-value.is-new {
            color: #6d28d9;
        }
        .upd-status {
            font-size: 0.8125rem;
            color: #4b5563;
            line-height: 1.45;
            min-height: 1.125rem;
        }
        .upd-status.is-ok { color: #059669; }
        .upd-status.is-err { color: #dc2626; }
        .upd-status.is-info { color: #6d28d9; }
        .upd-meta {
            font-size: 0.6875rem;
            color: #9ca3af;
            line-height: 1.4;
        }
        .upd-field-label {
            margin: 0;
            font-size: 0.6875rem;
            font-weight: 600;
            color: #6b7280;
        }
        .upd-node-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .upd-node-btn {
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #4b5563;
            font-size: 0.6875rem;
            font-weight: 500;
            padding: 0.3rem 0.55rem;
            border-radius: 9999px;
            cursor: pointer;
            line-height: 1.2;
        }
        .upd-node-btn:hover:not(:disabled) {
            border-color: #c4b5fd;
            color: #6d28d9;
        }
        .upd-node-btn.is-active {
            border-color: #7c3aed;
            background: #7c3aed;
            color: #fff;
        }
        .upd-node-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .upd-node-fixed {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.6875rem;
            color: #6b7280;
            padding: 0.35rem 0.55rem;
            border: 1px dashed #d1d5db;
            border-radius: 9999px;
            background: #fafafa;
        }
        .upd-changelog {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-height: 0;
        }
        .upd-changelog-body {
            margin: 0;
            flex: 1 1 auto;
            min-height: 8rem;
            max-height: 16rem;
            overflow: auto;
            padding: 0.55rem 0.65rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: #fafafa;
            color: #374151;
            font-size: 0.6875rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .upd-changelog-body.is-empty {
            color: #9ca3af;
            font-style: italic;
        }
        .upd-progress {
            display: none;
            flex-direction: column;
            gap: 0.35rem;
        }
        .upd-progress.is-visible { display: flex; }
        .upd-progress-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.6875rem;
            color: #4b5563;
        }
        .upd-progress-pct {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .upd-bar-track {
            height: 0.375rem;
            background: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
        }
        .upd-bar-fill {
            height: 100%;
            width: 0%;
            background: #7c3aed;
            border-radius: 9999px;
            transition: width 0.2s ease-out;
        }
        .upd-bar-fill.is-tdp {
            background: #8b5cf6;
        }
        .upd-progress-detail {
            margin: 0;
            font-size: 0.625rem;
            color: #9ca3af;
            min-height: 0.875rem;
        }
        .upd-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: auto;
            padding-top: 0.25rem;
        }
        .upd-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            padding: 0.4rem 0.7rem;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #374151;
            font-size: 0.75rem;
            cursor: pointer;
            line-height: 1.25;
        }
        .upd-btn:hover:not(:disabled) {
            background: #f9fafb;
        }
        .upd-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .upd-btn-primary {
            background: #7c3aed;
            border-color: #7c3aed;
            color: #fff;
        }
        .upd-btn-primary:hover:not(:disabled) {
            background: #6d28d9;
            border-color: #6d28d9;
        }
        .upd-btn-ghost {
            background: transparent;
            border-color: transparent;
            color: #6b7280;
        }
        .upd-btn-ghost:hover:not(:disabled) {
            background: #f3f4f6;
            color: #374151;
        }
        .upd-footer {
            padding: 0.55rem 1.25rem;
            border-top: 1px solid #e5e7eb;
            background: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .upd-footer p {
            margin: 0;
            font-size: 0.625rem;
            color: #9ca3af;
            line-height: 1.4;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="upd-header">
        <img src="icon.png" alt="" width="36" height="36" decoding="async">
        <div>
            <h1>更新中心</h1>
            <p>软件版本与语言优化包</p>
        </div>
    </header>

    <nav class="upd-tabs" role="tablist" aria-label="更新类型">
        <button type="button" id="tabBtnApp" class="upd-tab-btn is-active" role="tab" aria-selected="true" aria-controls="tabPanelApp" data-upd-tab="app">软件更新</button>
        <button type="button" id="tabBtnTdp" class="upd-tab-btn" role="tab" aria-selected="false" aria-controls="tabPanelTdp" data-upd-tab="tdp">
            语言优化包
            <span id="tdpTabBadge" class="upd-tab-badge hidden" aria-hidden="true"></span>
        </button>
    </nav>

    <main class="upd-body">
        <section id="tabPanelApp" class="upd-tab-panel is-active" role="tabpanel" aria-labelledby="tabBtnApp" data-upd-panel="app">
            <p class="upd-meta" style="margin:0;">GitHub · GitCode 发布页（zip 解压版应用内更新）</p>

            <div class="upd-version-row">
                <div class="upd-version-pill">
                    <span class="upd-version-label">本机版本</span>
                    <span id="appCurrentVersion" class="upd-version-value">…</span>
                </div>
                <div class="upd-version-pill is-highlight">
                    <span class="upd-version-label">服务端版本</span>
                    <span id="appServerVersion" class="upd-version-value">—</span>
                </div>
            </div>

            <p id="appUpdateStatus" class="upd-status" role="status" aria-live="polite">准备检查…</p>
            <p id="appUpdateMeta" class="upd-meta"></p>

            <div>
                <p class="upd-field-label">更新节点</p>
                <div id="appUpdateNodeGroup" class="upd-node-group" role="radiogroup" aria-label="软件更新节点">
                    <button type="button" class="upd-node-btn is-active" data-update-source="auto">自动</button>
                    <button type="button" class="upd-node-btn" data-update-source="gitcode">GitCode</button>
                    <button type="button" class="upd-node-btn" data-update-source="github">GitHub</button>
                </div>
            </div>

            <div class="upd-changelog">
                <p class="upd-field-label">更新日志</p>
                <pre id="appChangelogBody" class="upd-changelog-body is-empty">检查完成后显示最新版本说明</pre>
            </div>

            <div id="appDownloadProgress" class="upd-progress" aria-live="polite">
                <div class="upd-progress-row">
                    <span id="appDownloadLabel">正在下载…</span>
                    <span id="appDownloadPercent" class="upd-progress-pct">0%</span>
                </div>
                <div class="upd-bar-track">
                    <div id="appDownloadBar" class="upd-bar-fill" style="width:0%"></div>
                </div>
                <p id="appDownloadDetail" class="upd-progress-detail"></p>
            </div>

            <div class="upd-actions">
                <button type="button" id="appCheckBtn" class="upd-btn">
                    <i class="fa fa-refresh" aria-hidden="true"></i>
                    <span>检查更新</span>
                </button>
                <button type="button" id="appDownloadBtn" class="upd-btn upd-btn-primary hidden" disabled>
                    <i class="fa fa-download" aria-hidden="true"></i>
                    <span>下载并安装</span>
                </button>
                <button type="button" id="appOpenReleasesBtn" class="upd-btn hidden" disabled>
                    <i class="fa fa-external-link" aria-hidden="true"></i>
                    <span>打开发布页</span>
                </button>
                <button type="button" id="appInstallBtn" class="upd-btn upd-btn-primary hidden" disabled>
                    <i class="fa fa-power-off" aria-hidden="true"></i>
                    <span>重启安装</span>
                </button>
            </div>
        </section>

        <section id="tabPanelTdp" class="upd-tab-panel" role="tabpanel" aria-labelledby="tabBtnTdp" data-upd-panel="tdp" hidden>
            <p class="upd-meta" style="margin:0;">[Pro专属功能]过滤、清理、词库与翻译优化规则</p>

            <div class="upd-version-row">
                <div class="upd-version-pill">
                    <span class="upd-version-label">本机版本</span>
                    <span id="tdpCurrentVersion" class="upd-version-value">…</span>
                </div>
                <div class="upd-version-pill is-highlight">
                    <span class="upd-version-label">服务端版本</span>
                    <span id="tdpServerVersion" class="upd-version-value">—</span>
                </div>
            </div>

            <p id="tdpUpdateStatus" class="upd-status" role="status" aria-live="polite">准备检查…</p>
            <p id="tdpUpdateMeta" class="upd-meta"></p>

            <div class="upd-changelog">
                <p class="upd-field-label">更新说明</p>
                <pre id="tdpChangelogBody" class="upd-changelog-body is-empty">检查完成后显示优化包说明</pre>
            </div>

            <div id="tdpDownloadProgress" class="upd-progress" aria-live="polite">
                <div class="upd-progress-row">
                    <span id="tdpDownloadLabel">正在下载…</span>
                    <span id="tdpDownloadPercent" class="upd-progress-pct">0%</span>
                </div>
                <div class="upd-bar-track">
                    <div id="tdpDownloadBar" class="upd-bar-fill is-tdp" style="width:0%"></div>
                </div>
                <p id="tdpDownloadDetail" class="upd-progress-detail"></p>
            </div>

            <div class="upd-actions">
                <button type="button" id="tdpCheckBtn" class="upd-btn">
                    <i class="fa fa-refresh" aria-hidden="true"></i>
                    <span>检查更新</span>
                </button>
                <button type="button" id="tdpUpdateBtn" class="upd-btn upd-btn-primary" disabled>
                    <i class="fa fa-cloud-download" aria-hidden="true"></i>
                    <span>立即更新</span>
                </button>
                <button type="button" id="tdpCancelBtn" class="upd-btn hidden" disabled>
                    <span>取消</span>
                </button>
            </div>
        </section>
    </main>

    <footer class="upd-footer">
        <button type="button" id="closeBtn" class="upd-btn upd-btn-ghost">关闭</button>
    </footer>

    <script src="js/update-window.js"></script>
</body>
</html>
