<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:;">
    <title>选择本地模型 — Transub Pro</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="vendor/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="vendor/app.css">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            background: #f9fafb;
            color: #1f2937;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .hdr {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem 0.75rem;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            flex-shrink: 0;
        }
        .hdr img { width: 2rem; height: 2rem; border-radius: 0.4rem; }
        .hdr h1 { margin: 0; font-size: 0.95rem; font-weight: 700; }
        .hdr p { margin: 0.15rem 0 0; font-size: 0.75rem; color: #9ca3af; }
        .toolbar {
            flex-shrink: 0;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        .search {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            outline: none;
            background: #f9fafb;
        }
        .search:focus { border-color: #a5b4fc; background: #fff; box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }
        .chip {
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 999px;
            padding: 0.2rem 0.7rem;
            font-size: 0.75rem;
            color: #4b5563;
            cursor: pointer;
        }
        .chip.is-on {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }
        .chip.is-pro {
            border-style: dashed;
        }
        .badge.is-pro {
            background: #f5f3ff;
            color: #5b21b6;
            border: 1px solid #ddd6fe;
        }
        .hint-pro {
            margin: 0;
            font-size: 0.75rem;
            color: #6b7280;
        }
        .hint-pro strong { color: #4338ca; font-weight: 600; }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #6b7280;
        }
        .body {
            flex: 1;
            min-height: 0;
            padding: 0.875rem 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            background: #fff;
            padding: 0.875rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .card.is-active {
            border-color: #818cf8;
            box-shadow: 0 0 0 1px rgba(99,102,241,0.25);
        }
        .card.is-ram-tight {
            opacity: 0.72;
            border-color: #fcd34d;
            background: #fffbeb;
        }
        .badge.is-warn { background: #fef3c7; color: #b45309; }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .card-title { font-size: 0.9rem; font-weight: 650; color: #111827; }
        .card-sub { margin-top: 0.15rem; font-size: 0.75rem; color: #6b7280; line-height: 1.4; }
        .badges { display: flex; flex-wrap: wrap; gap: 0.25rem; justify-content: flex-end; }
        .badge {
            font-size: 0.6875rem;
            padding: 0.1rem 0.45rem;
            border-radius: 999px;
            background: #f3f4f6;
            color: #4b5563;
            white-space: nowrap;
        }
        .badge.is-rec { background: #eef2ff; color: #4338ca; }
        .badge.is-free { background: #ecfdf5; color: #047857; }
        .badge.is-ok { background: #ecfdf5; color: #047857; }
        .badge.is-use { background: #fef3c7; color: #b45309; }
        .card-note { margin: 0; font-size: 0.75rem; color: #6b7280; line-height: 1.5; }
        .card-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .btn {
            border: 1px solid #e5e7eb;
            background: #fff;
            border-radius: 0.5rem;
            padding: 0.35rem 0.7rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: #374151;
        }
        .btn:hover { background: #f9fafb; }
        .btn-primary {
            border-color: #4f46e5;
            background: #4f46e5;
            color: #fff;
        }
        .btn-primary:hover { background: #4338ca; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .empty {
            text-align: center;
            color: #9ca3af;
            font-size: 0.875rem;
            padding: 2rem 1rem;
        }
        .foot {
            flex-shrink: 0;
            border-top: 1px solid #e5e7eb;
            background: #fff;
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }
        .status { font-size: 0.75rem; color: #6b7280; min-height: 1rem; }
        .status.is-ok { color: #047857; }
        .status.is-err { color: #b91c1c; }
    </style>
</head>
<body>
    <header class="hdr">
        <img src="icon.png" alt="">
        <div>
            <h1>选择本地模型</h1>
            <p id="pickSubtitle">下载推理模型，由 Transub 自带 llama-server 推理</p>
        </div>
    </header>
    <div class="toolbar">
        <input type="search" id="pickSearch" class="search" placeholder="搜索名称、文件名、系列…" autocomplete="off">
        <div id="pickFilters" class="filters" role="tablist" aria-label="模型系列"></div>
        <div id="pickScaleFilters" class="filters" role="tablist" aria-label="模型规格" hidden></div>
        <p id="pickProHint" class="hint-pro" hidden></p>
        <div class="meta-row">
            <span id="pickCount">—</span>
            <button type="button" id="pickRefreshBtn" class="btn">刷新状态</button>
        </div>
    </div>
    <main id="pickList" class="body" aria-live="polite"></main>
    <footer class="foot">
        <p id="pickStatus" class="status"></p>
        <button type="button" id="pickCloseBtn" class="btn">关闭</button>
    </footer>
    <script src="vendor/opencc-js/full.js"></script>
    <script src="js/subtitle-chinese-core.js"></script>
    <script src="js/i18n-core.js"></script>
    <script src="js/i18n-catalogs.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/advanced-llm-pick-window.js"></script>
</body>
</html>
