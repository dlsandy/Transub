<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transub 字幕工厂</title>
    <style>
        :root {
            --splash-bg: #f9fafb;
            --splash-fg: #1f2937;
            --splash-muted: #6b7280;
            --splash-ring: #e5e7eb;
            --splash-accent: #c30d23;
            --splash-shadow: rgba(15, 23, 42, 0.08);
        }
        html.main-theme-dark {
            color-scheme: dark;
            --splash-bg: #141214;
            --splash-fg: #f3efef;
            --splash-muted: #a39e9f;
            --splash-ring: #2a2728;
            --splash-accent: #e85a6a;
            --splash-shadow: rgba(0, 0, 0, 0.35);
        }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--splash-bg);
            color: var(--splash-fg);
            font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .wrap {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .logo {
            width: 56px;
            height: 56px;
            object-fit: cover;
        }
        .brand {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .msg {
            margin: 0;
            font-size: 0.8125rem;
            color: var(--splash-muted);
        }
        .spinner {
            width: 1.75rem;
            height: 1.75rem;
            border: 2.5px solid var(--splash-ring);
            border-top-color: var(--splash-accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-top: 0.25rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        (function () {
            try {
                var dark = localStorage.getItem('transub.mainTheme') === 'dark'
                    || localStorage.getItem('transub-editor-theme') === 'dark';
                if (dark) {
                    document.documentElement.classList.add('main-theme-dark');
                }
            } catch (e) { /* ignore */ }
        }());
    </script>
</head>
<body>
    <div class="wrap" role="status" aria-live="polite">
        <img class="logo" src="icon-64.png" alt="" width="56" height="56" decoding="async">
        <p class="brand">Transub 字幕工厂</p>
        <p class="msg" id="splashMsg">正在启动…</p>
        <div class="spinner" aria-hidden="true"></div>
    </div>
    <script>
        (function () {
            var params = new URLSearchParams(location.search || '');
            var kind = String(params.get('kind') || '').trim().toLowerCase();
            var custom = String(params.get('msg') || '').trim();
            var sequences = {
                settings: ['正在打开设置…', '正在加载配置…', '即将就绪…'],
                wizard: ['正在打开设置向导…', '正在准备步骤…', '即将就绪…'],
                app: ['正在启动…', '正在加载界面…', '即将就绪…'],
            };
            var msgs = custom
                ? [custom, '正在加载界面…', '即将就绪…']
                : (sequences[kind] || sequences.app);
            var i = 0;
            var el = document.getElementById('splashMsg');
            if (el) el.textContent = msgs[0];
            setInterval(function () {
                i = (i + 1) % msgs.length;
                if (el) el.textContent = msgs[i];
            }, 1200);
        }());
    </script>
</body>
</html>
